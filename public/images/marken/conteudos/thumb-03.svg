<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EDE8DF"/>
      <stop offset="50%" stop-color="#EDE8DF"/>
      <stop offset="100%" stop-color="#C9BFAE"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#9A7E50" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#9A7E50" stop-opacity="0"/>
    </radialGradient>
    <pattern id="pat" x="0" y="0" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="6" height="6" fill="none"/>
      <line x1="0" y1="0" x2="6" y2="0" stroke="#B5A98E" stroke-width="0.4" opacity="0.35"/>
      <line x1="0" y1="3" x2="6" y2="3" stroke="#B5A98E" stroke-width="0.3" opacity="0.2"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#B5A98E" stroke-width="0.4" opacity="0.35"/>
      <line x1="3" y1="0" x2="3" y2="6" stroke="#B5A98E" stroke-width="0.3" opacity="0.2"/>
    </pattern>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#pat)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <rect x="40" y="40" width="320" height="320" fill="none" stroke="#9A7E50" stroke-width="1" opacity="0.25"/>
  <rect x="48" y="48" width="304" height="304" fill="none" stroke="#9A7E50" stroke-width="0.5" opacity="0.15"/>
  <g transform="translate(200, 160)">
    <text x="0" y="0" font-family="Georgia, serif" font-size="100" font-weight="500" fill="#9A7E50" opacity="0.1" text-anchor="middle" letter-spacing="6">MF</text>
  </g>
  <text x="200" y="260" font-family="Inter, sans-serif" font-size="13" font-weight="600" fill="#9A7E50" text-anchor="middle" letter-spacing="4" opacity="0.75">TENDÊNCIA</text>
  <line x1="160" y1="280" x2="240" y2="280" stroke="#9A7E50" stroke-width="1" opacity="0.5"/>
  <text x="200" y="320" font-family="Georgia, serif" font-size="28" font-weight="600" fill="#1F1C18" text-anchor="middle" opacity="0.85">Novidades da Coleção</text>
  <text x="200" y="350" font-family="Inter, sans-serif" font-size="11" fill="#706A62" text-anchor="middle" opacity="0.55" letter-spacing="2">INSPIRAÇÃO</text>
